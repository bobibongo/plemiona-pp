<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analiza PP — Plemiona</title>
<style>/*INJECT:css*/</style>
</head>
<body>
<header><div class="wrap">
  <h1>Analiza punktów premium</h1>
  <p id="count">0 wpisów</p>
</div></header>

<main class="wrap">
<section id="dropzone">
  Przeciągnij tu pliki JSON (z bookmarkletu) lub CSV — albo <label class="link">wybierz<input id="file" type="file" multiple hidden></label>.
  <div class="actions"><button id="export">Eksportuj scalone</button><button id="reset">Wyczyść magazyn</button></div>
</section>

<section class="filters">
  <label>Świat: <select id="f-world"></select></label>
  <label>Od: <input id="f-from" type="date"></label>
  <label>Do: <input id="f-to" type="date"></label>
  <label>Granulacja: <select id="f-gran"><option value="day">dzień</option><option value="week">tydzień</option></select></label>
</section>

<section class="info">
  <div class="grp"><h3>Podsumowanie</h3><div id="info-main" class="kpis"></div></div>
  <div class="grp"><h3>Przychody</h3><div id="info-in" class="kpis"></div></div>
  <div class="grp"><h3>Wydatki</h3><div id="info-out" class="kpis"></div></div>
</section>
<section id="otherworlds" class="otherworlds" style="display:none"></section>

<section class="card"><div id="chart-saldo"></div></section>
<section class="card"><div id="chart-balance"></div></section>

<section class="grid">
  <div class="card"><h3>Efektywny kurs (surowce na 1 PP)</h3><table id="rates"></table></div>
  <div class="card"><h3>Wolumen surowców (Handel)</h3><table id="res"></table></div>
</section>

<h2 class="sect">Rozbicie na kategorie</h2>
<section id="breakdown" class="grid"></section>

<section class="card"><h3>Bilans wg okresu</h3><table id="buckets"></table></section>
</main>
<script type="module">/*INJECT:js*/</script>
</body>
</html>
