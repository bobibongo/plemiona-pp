<head>

<title>Analiza PP — Plemiona</title>
<style>:root {
  color-scheme: light;
  --wood-1: #2c2015;
  --wood-2: #170f08;
  --surface: #f4ead2;         /* pergamin */
  --surface-2: #ecdfbf;       /* ciemniejszy pergamin (nagłówki/zebra) */
  --ink: #38291a;             /* atrament */
  --ink-2: #6b543a;
  --ink-3: #93805f;
  --line: #dccca4;
  --line-strong: #c4ac7c;
  --accent: #7c2b2b;          /* oksblood (banner Plemion) */
  --accent-deep: #5f2020;
  --gold: #a8842c;
  --pos: #3f7a3a;
  --neg: #a5372a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", "SF Mono", Consolas, monospace;
  /* zmienne wykresów */
  --c-surface: #f4ead2;
  --c-grid: #ddcca2;
  --c-base: #c4ac7c;
  --c-axis: #93805f;
  --c-ink2: #6b543a;
  --c-pos: #3f7a3a;
  --c-neg: #a5372a;
  --c-line: #2f5b8c;
}

* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; color: var(--ink); font-size: 14px;
  background: radial-gradient(ellipse at 50% -10%, #3a2c1c 0%, var(--wood-1) 45%, var(--wood-2) 100%) fixed;
}
.wrap { width: 90%; max-width: 1200px; margin: 0 auto; }

header {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
  border-bottom: 3px solid var(--gold);
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
  padding: 15px 0;
}
header .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
header h1 { margin: 0; font-family: var(--serif); font-size: 25px; font-weight: 700; color: #f6ecd4; letter-spacing: .01em; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
#count { margin: 0; font-size: 12px; color: #e8cfa8; font-variant-numeric: tabular-nums; }

main { padding: 20px 0 52px; }
section { margin: 16px 0; }
h2.sect { margin: 26px 0 8px; font-family: var(--serif); font-size: 17px; color: #f0e2c4; }
.card > h3 { margin: 0 0 12px; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; padding-bottom: 7px; border-bottom: 1px solid var(--line); }

.card {
  background:
    radial-gradient(120% 80% at 25% 0%, rgba(255,251,240,.55), transparent 55%),
    var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 16px 18px;
  overflow-x: auto;
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 8px 22px rgba(0,0,0,.38);
}
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

#dropzone { border: 1.5px dashed var(--line-strong); background: rgba(244,234,210,.9); border-radius: 6px; padding: 15px; text-align: center; color: var(--ink-2); font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
#dropzone.over { background: #f6eecf; border-color: var(--accent); }
.link { color: var(--accent); cursor: pointer; font-weight: 700; }
.actions { margin-top: 10px; }
button { margin: 0 4px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 5px; color: var(--ink); font-size: 13px; font-weight: 600; }
button:hover { border-color: var(--accent); color: var(--accent); }

.filters { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: #e8dcc0; }
.filters select, .filters input { padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); color: var(--ink); font: inherit; }

/* Górne kafle */

.kpi { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column;
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 6px 16px rgba(0,0,0,.3); }

.kpi b i { font-style: normal; font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.kpi.sum { border-color: var(--gold); border-width: 2px; background: linear-gradient(180deg, #f7efd8, var(--surface)); }

/* Bloki szczegółów */
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.block h3 { border-bottom: 1px solid var(--line); }

/* Wykres salda na całą szerokość */

#chart-saldo { flex: 1; min-height: 260px; display: block; }

/* Dwie kolumny: bilans okresowy | konsolidacja */
.cols { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } }

#buckets td, #buckets th { white-space: nowrap; }

#buckets tr[data-key]:hover td { background: rgba(168,132,44,.10); }
#buckets tr.sel td { background: rgba(168,132,44,.18); }
#buckets tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

.lrow { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; font-size: 13.5px; }
.lrow span { color: var(--ink-2); }
.lrow b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.lrow b i { font-style: normal; color: var(--ink-3); font-size: 11px; margin-left: 3px; }
.lrow.sum { margin-top: 5px; padding-top: 7px; border-top: 1.5px solid var(--line-strong); }
.lrow.sum span { color: var(--ink); font-weight: 700; }
.lrow.sum b { font-weight: 700; font-size: 15.5px; }

.pos { color: var(--pos); } .neg { color: var(--neg); }
.hint { color: var(--ink-3); font-size: 13px; margin: 26px 0; text-align: center; font-style: italic; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); }
td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
th { color: var(--accent); font-weight: 700; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1.5px solid var(--line-strong); font-family: system-ui, sans-serif; }
th:first-child, td:first-child { text-align: left; font-family: system-ui, sans-serif; color: var(--ink-2); }
table tr:hover td { background: rgba(168,132,44,.08); }

#detail .grp-row td { background: var(--accent); color: #f6ecd4; font-weight: 700; letter-spacing: .08em; font-size: 10.5px; text-transform: uppercase; font-family: system-ui, sans-serif; }
#detail .cat td:first-child { font-weight: 700; color: var(--ink); }
#detail .sub td:first-child { padding-left: 26px; color: var(--ink-3); font-size: 12.5px; }
#detail .total-row td { background: var(--wood-1); color: #f6ecd4; font-weight: 700; border: none; }
#detail .total-row td:first-child { color: #f6ecd4; }
#detail .total-row td.pos { color: #8fd08a; } #detail .total-row td.neg { color: #f0a599; }

svg.chart { width: 100%; height: auto; display: block; }
svg .bar, svg .dot { transition: opacity .1s; }
svg .bar:hover, svg .dot:hover { opacity: .72; cursor: pointer; }
#tt { position: fixed; z-index: 9999; display: none; pointer-events: none; background: var(--wood-1); color: #f6ecd4; border: 1px solid var(--gold);
  padding: 7px 10px; border-radius: 6px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.5); }

<script type="module">// src/shared-date.js
// Format: "DD.MM. HH:MM" (rok bieżący) lub "DD.MM.YY HH:MM" (rok 20YY).
const RE = /^(\d{2})\.(\d{2})\.(?:(\d{2}))?\s+(\d{2}):(\d{2})$/;function parsePremiumDate(dateRaw, now = new Date()) {
  const s = String(dateRaw).replace(/ /g, ' ').trim();
  const m = RE.exec(s);
  if (!m) throw new Error(`Nieparsowalna data: ${JSON.stringify(dateRaw)}`);
  const [, dd, mm, yy, hh, min] = m;
  const year = yy !== undefined ? 2000 + Number(yy) : now.getFullYear();
  return new Date(year, Number(mm) - 1, Number(dd), Number(hh), Number(min), 0, 0);
}

// src/parse.js

const NBSP = / /g;
function parseNumber(raw) {
  const s = String(raw).replace(NBSP, '').replace(/\s/g, '').replace('+', '');
  const n = Number(s);
  if (Number.isNaN(n)) throw new Error(`Nieparsowalna liczba: ${JSON.stringify(raw)}`);
  return n;
}

const RESOURCE_MAP = [
  [/drewno/i, 'drewno'],
  [/glina/i, 'glina'],
  [/(żelazo|zelazo)/i, 'zelazo'],
];
function extractResource(info) {
  const s = String(info);
  const amountMatch = /\((\d+)\)/.exec(s);
  for (const [re, key] of RESOURCE_MAP) {
    if (re.test(s)) {
      return { resource: key, amount: amountMatch ? Number(amountMatch[1]) : null };
    }
  }
  return { resource: null, amount: null };
}

// Kolejność ma znaczenie — pierwszy pasujący wygrywa.
const SUBSCRIPTION_MAP = [
  [/konto premium/i, 'Konto premium'],
  [/^premium\b/i, 'Konto premium'],
  [/men[ae]d[żz]er kont/i, 'Menadżer konta'],
  [/asystent farmera/i, 'Asystent farmera'],
  [/20\s*%.*(żelaz|zelaz)/i, '+20% żelaza'],
  [/20\s*%.*glin/i, '+20% gliny'],
  [/20\s*%.*drewn/i, '+20% drewna'],
];

const SERVICE_MAP = [
  [/redukcja czasu/i, 'Redukcja czasu budowy'],
  [/natychmiastowe zako[ńn]czenie/i, 'Natychmiastowe zakończenie'],
  [/miejscowym kupcem/i, 'Handel z miejscowym kupcem'],
  [/wymiana manuskryptu/i, 'Wymiana manuskryptu'],
  [/wskrzeszenie rycerza/i, 'Wskrzeszenie rycerza'],
  [/zmniejsz koszt budowy/i, 'Zmniejsz koszt budowy'],
];

// Nazwa eventu: bez treści w nawiasach i bez ogona po " - ".
function eventLabel(info) {
  const s = String(info).replace(/\(.*?\)/g, '').replace(/\s*-\s.*$/, '').trim();
  return s || String(info).trim();
}
function classify(raw) {
  const info = String(raw.info || '');
  const txType = String(raw.txType || '').replace(NBSP, '').trim();
  const { resource, amount } = extractResource(info);

  // 1. Handel (po treści, niezależnie od typu transakcji)
  if (/-kupno:/i.test(info)) return { category: 'handel', subtype: 'kupno', label: 'Kupno', resource, amount };
  if (/-sprzeda[żz]:/i.test(info)) return { category: 'handel', subtype: 'sprzedaz', label: 'Sprzedaż', resource, amount };

  // 2. Subskrypcje
  for (const [re, label] of SUBSCRIPTION_MAP) {
    if (re.test(info)) return { category: 'subskrypcje', subtype: label, label, resource: null, amount: null };
  }

  // 3. Usługi
  for (const [re, label] of SERVICE_MAP) {
    if (re.test(info)) return { category: 'uslugi', subtype: label, label, resource: null, amount: null };
  }

  // 4. Zakup PP (realne pieniądze lub przeniesienie PP od graczy)
  if (txType === 'Kupno' || txType === 'Przeniesienie') {
    return { category: 'zakup_pp', subtype: 'zakup_pp', label: 'Zakup PP', resource: null, amount: null };
  }

  // 5. Eventy — reszta
  return { category: 'eventy', subtype: 'event', label: eventLabel(info), resource: null, amount: null };
}

// Zegar ścienny z logu (czas polski) zapisujemy jako UTC-ISO, żeby dzień/tydzień
// były deterministyczne niezależnie od strefy czasowej przeglądarki.
function wallClockISO(d) {
  const p = (n, w = 2) => String(n).padStart(w, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T` +
    `${p(d.getHours())}:${p(d.getMinutes())}:00.000Z`;
}
function enrich(raw, now = new Date()) {
  const ts = wallClockISO(parsePremiumDate(raw.dateRaw, now));
  const change = parseNumber(raw.changeRaw);
  const balance = parseNumber(raw.balanceRaw);
  const world = String(raw.world).replace(NBSP, '').trim();
  const info = String(raw.info).trim();
  const cls = classify(raw);
  return { ts, world, txType: String(raw.txType).replace(NBSP, '').trim(),
    change, balance, info, ...cls };
}
function entryKey(e) {
  return `${e.world}|${e.ts}|${e.change}|${e.info}`;
}

// src/merge.jsfunction dedupeMerge(existing, incoming) {
  const byKey = new Map();
  for (const e of incoming) byKey.set(entryKey(e), e);   // incoming jako baza
  for (const e of existing) byKey.set(entryKey(e), e);   // existing nadpisuje (wygrywa)
  return [...byKey.values()].sort((x, y) => (x.ts < y.ts ? 1 : x.ts > y.ts ? -1 : 0));
}

// src/aggregate.js
function isoWeek(d) {
  const date = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = (date.getUTCDay() + 6) % 7;          // pon=0
  date.setUTCDate(date.getUTCDate() - day + 3);     // czwartek tego tygodnia
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return { year: date.getUTCFullYear(), week };
}
function bucketKey(ts, granularity) {
  const d = new Date(ts);
  if (granularity === 'week') {
    const { year, week } = isoWeek(d);
    return `${year}-W${String(week).padStart(2, '0')}`;
  }
  const y = d.getUTCFullYear(), m = String(d.getUTCMonth() + 1).padStart(2, '0'), day = String(d.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

const RES = ['drewno', 'glina', 'zelazo'];
const CATEGORIES = ['handel', 'zakup_pp', 'subskrypcje', 'uslugi', 'eventy'];

function newBucket(key) {
  const b = { key, net: 0, earned: 0, spent: 0, bought: 0, sold: 0, resDiff: 0 };
  for (const c of CATEGORIES) b[c] = 0;
  return b;
}
function aggregate(entries, { granularity }) {
  const map = new Map();
  const totals = {
    net: 0, earned: 0, spent: 0,
    resources: Object.fromEntries(RES.map(r => [r, { bought: 0, sold: 0, diff: 0 }])),
    resTotal: { bought: 0, sold: 0, diff: 0 },
    breakdown: Object.fromEntries(CATEGORIES.map(c => [c, {}])),
  };
  for (const c of CATEGORIES) totals[c] = 0;

  for (const e of entries) {
    const key = bucketKey(e.ts, granularity);
    if (!map.has(key)) map.set(key, newBucket(key));
    const b = map.get(key);

    b.net += e.change; totals.net += e.change;
    if (e.change >= 0) { b.earned += e.change; totals.earned += e.change; }
    else { b.spent += e.change; totals.spent += e.change; }

    if (CATEGORIES.includes(e.category)) {
      b[e.category] += e.change;
      totals[e.category] += e.change;
      const label = e.label || e.subtype || 'inne';
      totals.breakdown[e.category][label] = (totals.breakdown[e.category][label] || 0) + e.change;
    }
    if (e.category === 'handel' && e.resource && e.amount) {
      const dir = e.subtype === 'kupno' ? 'bought' : 'sold';
      totals.resources[e.resource][dir] += e.amount;
      totals.resTotal[dir] += e.amount;
      b[dir] += e.amount;
    }
  }

  for (const r of RES) totals.resources[r].diff = totals.resources[r].bought - totals.resources[r].sold;
  totals.resTotal.diff = totals.resTotal.bought - totals.resTotal.sold;
  for (const b of map.values()) b.resDiff = b.bought - b.sold;

  const buckets = [...map.values()].sort((a, b) => (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
  return { buckets, totals };
}

// Efektywny kurs jako ILOŚĆ SUROWCA na 1 PP (kupno i sprzedaż osobno).
function effectiveRates(entries) {
  const acc = Object.fromEntries(RES.map(r => [r, { buyPP: 0, buyAmt: 0, sellPP: 0, sellAmt: 0 }]));
  for (const e of entries) {
    if (e.category !== 'handel' || !e.resource || !e.amount) continue;
    const a = acc[e.resource];
    if (e.subtype === 'kupno') { a.buyPP += Math.abs(e.change); a.buyAmt += e.amount; }
    else { a.sellPP += Math.abs(e.change); a.sellAmt += e.amount; }
  }
  const out = {};
  for (const r of RES) {
    const a = acc[r];
    out[r] = {
      buy: a.buyPP ? a.buyAmt / a.buyPP : null,
      sell: a.sellPP ? a.sellAmt / a.sellPP : null,
    };
  }
  return out;
}

// src/charts.js
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const M = { left: 52, right: 16, top: 22, bottom: 46 };
const INK = 'var(--c-axis, #8b95a3)';    // atrament etykiet osi
const GRID = 'var(--c-grid, #e4e9ef)';   // hairline siatki
const BASE = 'var(--c-base, #cbd3dd)';   // linia bazowa / oś
const POS = 'var(--c-pos, #1a7f4b)';     // dodatnie
const NEG = 'var(--c-neg, #c1443a)';     // ujemne
const LINE = 'var(--c-line, #3b4aa0)';   // seria salda
const INK2 = 'var(--c-ink2, #566072)';   // tytuł

function empty(width, height) {
  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" class="chart" preserveAspectRatio="xMidYMid meet">` +
    `<text x="${width / 2}" y="${height / 2}" text-anchor="middle" fill="${INK}" font-size="12">brak danych</text></svg>`;
}

function niceTicks(min, max, count = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const rawStep = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const start = Math.floor(min / step) * step;
  const end = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = start; v <= end + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return ticks;
}

function fmtTick(n) {
  const a = Math.abs(n);
  if (a >= 1000) return (n / 1000).toLocaleString('pl-PL', { maximumFractionDigits: 1 }) + 'k';
  return n.toLocaleString('pl-PL', { maximumFractionDigits: 0 });
}

function frame(width, height, title, domainMin, domainMax) {
  const plotW = width - M.left - M.right;
  const plotH = height - M.top - M.bottom;
  const yOf = v => M.top + (domainMax - v) / (domainMax - domainMin) * plotH;
  const ticks = niceTicks(domainMin, domainMax);
  let grid = '';
  for (const t of ticks) {
    if (t < domainMin - 1e-9 || t > domainMax + 1e-9) continue;
    const y = yOf(t);
    grid += `<line x1="${M.left}" y1="${y.toFixed(1)}" x2="${width - M.right}" y2="${y.toFixed(1)}" stroke="${GRID}"/>`;
    grid += `<text x="${M.left - 7}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${INK}" style="font-variant-numeric:tabular-nums">${esc(fmtTick(t))}</text>`;
  }
  const t = title ? `<text x="${M.left}" y="13" font-size="12.5" fill="${INK2}" font-weight="600">${esc(title)}</text>` : '';
  return { plotW, plotH, yOf, grid, titleEl: t };
}
function barChartSVG(series, opts = {}) {
  const { width = 1000, height = 260, title = '' } = opts;
  if (!series.length) return empty(width, height);
  const vals = series.map(s => s.value);
  const domainMax = Math.max(1, 0, ...vals);
  const domainMin = Math.min(0, ...vals);
  const { plotW, yOf, grid, titleEl } = frame(width, height, title, domainMin, domainMax);
  const zeroY = yOf(0);
  const bw = plotW / series.length;
  const everyX = Math.ceil(series.length / 16);
  let bars = '', xlabels = '';
  series.forEach((s, i) => {
    const x = M.left + i * bw + bw * 0.18;
    const w = Math.max(1, bw * 0.64);
    const top = s.value >= 0 ? yOf(s.value) : zeroY;
    const h = Math.max(1, Math.abs(yOf(s.value) - zeroY));
    const color = s.color || (s.value >= 0 ? POS : NEG);
    const rx = Math.min(2, w / 2);
    bars += `<rect class="bar" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${rx}" fill="${color}" data-label="${esc(s.label)}" data-value="${s.value}"><title>${esc(s.label)}: ${s.value}</title></rect>`;
    if (i % everyX === 0) {
      const cx = M.left + i * bw + bw / 2;
      const ly = height - M.bottom + 14;
      xlabels += `<text x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="end" font-size="9.5" fill="${INK}" transform="rotate(-38 ${cx.toFixed(1)} ${ly.toFixed(1)})">${esc(s.label)}</text>`;
    }
  });
  const zeroLine = `<line x1="${M.left}" y1="${zeroY.toFixed(1)}" x2="${width - M.right}" y2="${zeroY.toFixed(1)}" stroke="${BASE}"/>`;
  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" class="chart" preserveAspectRatio="xMidYMid meet">${titleEl}${grid}${zeroLine}${bars}${xlabels}</svg>`;
}
function lineChartSVG(points, opts = {}) {
  const { width = 1000, height = 260, title = '', endLabel = false } = opts;
  if (!points.length) return empty(width, height);
  const ys = points.map(p => p.y);
  let domainMin = Math.min(...ys), domainMax = Math.max(...ys);
  if (domainMin === domainMax) { domainMin -= 1; domainMax += 1; }
  const { plotW, plotH, yOf, grid, titleEl } = frame(width, height, title, domainMin, domainMax);
  const xOf = i => M.left + (points.length === 1 ? plotW / 2 : (i / (points.length - 1)) * plotW);
  const bottomY = M.top + plotH;
  const coords = points.map((p, i) => `${xOf(i).toFixed(1)},${yOf(p.y).toFixed(1)}`).join(' ');
  // wypełnienie pod linią (obszar) dla czytelności
  const areaPts = `${xOf(0).toFixed(1)},${bottomY.toFixed(1)} ${coords} ${xOf(points.length - 1).toFixed(1)},${bottomY.toFixed(1)}`;
  const showDots = points.length <= 45;
  let dots = '';
  for (let i = 0; i < points.length; i++) {
    const r = showDots ? 2.6 : 0;
    dots += `<circle class="dot" cx="${xOf(i).toFixed(1)}" cy="${yOf(points[i].y).toFixed(1)}" r="${r}" fill="${LINE}" stroke="var(--c-surface, #fff)" stroke-width="1" data-label="${esc(points[i].x)}" data-value="${points[i].y}"><title>${esc(points[i].x)}: ${points[i].y}</title></circle>`;
  }
  const axis = `<line x1="${M.left}" y1="${bottomY.toFixed(1)}" x2="${width - M.right}" y2="${bottomY.toFixed(1)}" stroke="${BASE}"/>`;
  const everyX = Math.ceil(points.length / 6);
  let xlabels = '';
  for (let i = 0; i < points.length; i += everyX) {
    xlabels += `<text x="${xOf(i).toFixed(1)}" y="${(height - M.bottom + 16).toFixed(1)}" text-anchor="middle" font-size="10" fill="${INK}">${esc(String(points[i].x))}</text>`;
  }
  let endMark = '';
  if (endLabel) {
    const i = points.length - 1;
    const ex = xOf(i), ey = yOf(points[i].y);
    const val = Number(points[i].y).toLocaleString('pl-PL');
    const anchor = ex > width - M.right - 60 ? 'end' : 'start';
    const tx = anchor === 'end' ? ex - 8 : ex + 8;
    endMark = `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4" fill="${LINE}" stroke="var(--c-surface,#fff)" stroke-width="1.5"/>` +
      `<text x="${tx.toFixed(1)}" y="${(ey - 8).toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="${LINE}">${val} PP</text>`;
  }
  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" class="chart" preserveAspectRatio="xMidYMid meet">${titleEl}${grid}${axis}` +
    `<polygon points="${areaPts}" fill="${LINE}" fill-opacity="0.10"/>` +
    `<polyline fill="none" stroke="${LINE}" stroke-width="2.2" stroke-linejoin="round" points="${coords}"/>${dots}${endMark}${xlabels}</svg>`;
}

// src/ui.js
function parseCSV(text) {
  const firstLine = text.split('\n')[0];
  const sep = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = [];
  for (const line of text.replace(/\r/g, '').split('\n')) {
    if (line === '') continue;
    const cells = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === sep) { cells.push(cur); cur = ''; }
      else cur += ch;
    }
    cells.push(cur);
    rows.push(cells);
  }
  return rows;
}

const COLS = ['dateRaw', 'world', 'txType', 'changeRaw', 'balanceRaw', 'info'];
function normalizeImport(fileText, fileName, now = new Date()) {
  const trimmed = fileText.trim();
  if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
    const data = JSON.parse(trimmed);
    if (Array.isArray(data)) return data;                 // legacy Entry[]
    if (Array.isArray(data.rows)) return data.rows.map(r => enrich(r, now));
    throw new Error('Nieznany format JSON');
  }
  const rows = parseCSV(fileText);
  const start = /data/i.test(rows[0]?.[0] || '') ? 1 : 0;
  return rows.slice(start).filter(r => r.length >= 6).map(cells => {
    const raw = {}; COLS.forEach((k, i) => raw[k] = cells[i]);
    return enrich(raw, now);
  });
}

// ——— Część DOM (przeglądarka) ———
if (typeof document !== 'undefined') {
  const KEY = 'plemiona_pp_store_v1';
  const $ = sel => document.querySelector(sel);
  const ALL = '__all__';

  const loadStore = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const saveStore = arr => localStorage.setItem(KEY, JSON.stringify(arr));

  const fmt = n => (n > 0 ? '+' : '') + Math.round(n).toLocaleString('pl-PL');
  const fmtNum = n => Math.round(n).toLocaleString('pl-PL');
  const fmtRate = n => n == null ? '—' : n.toLocaleString('pl-PL', { maximumFractionDigits: 1 });
  const sc = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';

  const selectedBuckets = new Set();   // wybrane dni w tabeli okresowej (prawa kolumna liczy dla nich)

  // Wykres salda rysujemy na dokładny rozmiar kontenera (wypełnia całą wysokość karty).
  let lastSaldoPts = [];
  function drawSaldo() {
    const box = $('#chart-saldo');
    if (!box) return;
    const w = Math.max(360, Math.round(box.clientWidth) || 900);
    const h = Math.max(260, Math.round(box.clientHeight) || 320);
    box.innerHTML = lineChartSVG(lastSaldoPts, { title: 'Saldo PP — całe konto', width: w, height: h, endLabel: true });
  }

  function dateBounds() {
    const from = $('#f-from').value ? new Date($('#f-from').value + 'T00:00:00Z') : null;
    const to = $('#f-to').value ? new Date($('#f-to').value + 'T23:59:59Z') : null;
    return { from, to };
  }
  const inDate = (e, from, to) => {
    const d = new Date(e.ts);
    return !(from && d < from) && !(to && d > to);
  };

  const kpi = (label, val, { unit = 'PP', signed = true, cls, sum = false, sub = '' } = {}) => {
    const txt = signed ? fmt(val) : fmtNum(val);
    const c = cls !== undefined ? cls : sc(val);
    return `<div class="kpi${sum ? ' sum' : ''}"><span>${label}</span><b class="${c}">${txt}<i>${unit}</i></b>` +
      (sub ? `<div class="kpi-sub">${sub}</div>` : '') + `</div>`;
  };
  const lrow = (label, val, { unit = 'PP', signed = true, cls, sum = false } = {}) => {
    const txt = signed ? fmt(val) : fmtNum(val);
    const c = cls !== undefined ? cls : sc(val);
    return `<div class="lrow${sum ? ' sum' : ''}"><span>${label}</span><b class="${c}">${txt}<i>${unit}</i></b></div>`;
  };
  const block = (title, rows) => `<div class="card block"><h3>${title}</h3>${rows}</div>`;

  function render() {
    const store = loadStore();
    const worlds = [...new Set(store.map(e => e.world))].sort();
    const sel = $('#f-world');
    const prev = sel.value || ALL;
    sel.innerHTML = `<option value="${ALL}">Wszystkie (sumarycznie)</option>` +
      worlds.map(w => `<option value="${w}">${w}</option>`).join('');
    sel.value = [...sel.options].some(o => o.value === prev) ? prev : ALL;
    const world = sel.value;
    const worldName = world === ALL ? 'Wszystkie światy' : world;
    const chosen = world !== ALL;

    const { from, to } = dateBounds();
    const dateFiltered = store.filter(e => inDate(e, from, to));
    const scoped = chosen ? dateFiltered.filter(e => e.world === world) : dateFiltered;

    const gran = $('#f-gran').value;
    const { buckets, totals: t } = aggregate(scoped, { granularity: gran });

    const bilansOgolny = dateFiltered.reduce((s, e) => s + e.change, 0);
    const bilansWybrany = scoped.reduce((s, e) => s + e.change, 0);
    const bilansInne = bilansOgolny - bilansWybrany;
    const handelIn = t.breakdown.handel['Sprzedaż'] || 0;
    const handelOut = t.breakdown.handel['Kupno'] || 0;
    const pozaSuma = t.subskrypcje + t.uslugi + t.eventy;

    // === Górny rząd: 4 kafle głównych sum ===
    $('#kpi-row').innerHTML =
      kpi('Bilans ogólny', bilansOgolny, {
        cls: sc(bilansOgolny), sum: true,
        sub: `${worldName}: <b class="${sc(bilansWybrany)}">${fmt(bilansWybrany)}</b> · ` +
             `Inne światy: <b class="${sc(bilansInne)}">${fmt(bilansInne)}</b>`,
      }) +
      kpi('Handel PP', t.handel) +
      kpi('Handel surowce', t.resTotal.diff, { unit: 'szt.' }) +
      kpi('Wydatki poza handlem', pozaSuma);

    // === 3 bloki szczegółów ===
    $('#blocks').innerHTML =
      block('Handel PP',
        lrow('Zyskane (sprzedaż)', handelIn, { cls: 'pos' }) +
        lrow('Wydane (kupno)', handelOut, { cls: 'neg' }) +
        lrow('Suma', t.handel, { sum: true })) +
      block('Handel surowce',
        lrow('Kupione', t.resTotal.bought, { unit: 'szt.', signed: false, cls: '' }) +
        lrow('Sprzedane', t.resTotal.sold, { unit: 'szt.', signed: false, cls: '' }) +
        lrow('Różnica', t.resTotal.diff, { unit: 'szt.', sum: true })) +
      block('Wydatki poza handlem',
        lrow('Subskrypcje', t.subskrypcje, { cls: 'neg' }) +
        lrow('Usługi', t.uslugi, { cls: 'neg' }) +
        lrow('Eventy', t.eventy, { cls: sc(t.eventy) }) +
        lrow('Suma', pozaSuma, { sum: true }));

    // === Wykres salda (cała szerokość) ===
    const shortKey = k => k.length === 10 ? k.slice(8, 10) + '.' + k.slice(5, 7) : k.replace(/^\d{4}-/, '');
    const closing = new Map();
    for (const e of [...dateFiltered].sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0))) {
      closing.set(bucketKey(e.ts, gran), e.balance);
    }
    lastSaldoPts = [...closing].map(([k, v]) => ({ x: shortKey(k), y: v }));
    drawSaldo();

    // === Wykres bilansu netto (po wybraniu świata) ===
    if (chosen) {
      $('#chart-balance').innerHTML = barChartSVG(
        buckets.map(b => ({ label: shortKey(b.key), value: b.net })), { title: `Bilans netto PP wg okresu — ${world}` });
    } else {
      $('#chart-balance').innerHTML = `<p class="hint">Wybierz świat w filtrze, aby zobaczyć bilans netto dzień po dniu.</p>`;
    }

    // === Bilans okresowy (lewa kolumna, klikalne daty) ===
    $('#buckets').innerHTML =
      `<tr><th>Data</th><th>Bilans PP</th><th>PP z handlu</th><th>Różnica surowców</th></tr>` +
      buckets.map(b => `<tr data-key="${b.key}"${selectedBuckets.has(b.key) ? ' class="sel"' : ''}><td>${b.key}</td>` +
        `<td class="${sc(b.net)}">${fmt(b.net)}</td>` +
        `<td class="${sc(b.handel)}">${fmt(b.handel)}</td>` +
        `<td class="${sc(b.resDiff)}">${b.resDiff ? fmt(b.resDiff) : '—'}</td></tr>`).join('');
    const n = selectedBuckets.size;
    $('#period-hint').innerHTML = n
      ? `Wybrane dni: <b>${n}</b> — <span class="link" id="clear-sel">wyczyść</span>`
      : `Kliknij wiersze, aby policzyć prawą kolumnę dla wybranych dni.`;

    // === Prawa kolumna (konsolidacja dla wyboru) ===
    const consEntries = n ? scoped.filter(e => selectedBuckets.has(bucketKey(e.ts, gran))) : scoped;
    const { totals: ct } = aggregate(consEntries, { granularity: gran });
    const crates = effectiveRates(consEntries);
    $('#cons-scope').innerHTML = n
      ? (n === 1 ? `Dane dla <b>1</b> wybranego dnia` : `Dane dla <b>${n}</b> wybranych dni`)
      : `Dane dla całego zakresu`;

    $('#restable').innerHTML =
      `<tr><th>Surowiec</th><th>Kupione</th><th>Sprzedane</th><th>Różnica</th></tr>` +
      ['drewno', 'glina', 'zelazo'].map(r => {
        const x = ct.resources[r];
        return `<tr><td>${r}</td><td>${fmtNum(x.bought)}</td><td>${fmtNum(x.sold)}</td>` +
          `<td class="${sc(x.diff)}">${fmt(x.diff)}</td></tr>`;
      }).join('');

    $('#rates').innerHTML =
      `<tr><th>Surowiec</th><th>Kurs kupno</th><th>Kurs sprzedaż</th></tr>` +
      ['drewno', 'glina', 'zelazo'].map(r =>
        `<tr><td>${r}</td><td>${fmtRate(crates[r].buy)}</td><td>${fmtRate(crates[r].sell)}</td></tr>`).join('');

    const cIn = ct.breakdown.handel['Sprzedaż'] || 0;
    const cOut = ct.breakdown.handel['Kupno'] || 0;
    const subRows = obj => Object.entries(obj).sort((a, b) => a[1] - b[1])
      .map(([k, v]) => `<tr class="sub"><td>${k}</td><td class="${sc(v)}">${fmt(v)}</td></tr>`).join('');
    let d = `<tr class="grp-row"><td>PRZYCHODY</td><td></td></tr>`;
    d += `<tr><td>Sprzedaż na giełdzie</td><td class="pos">${fmt(cIn)}</td></tr>`;
    if (ct.zakup_pp) d += `<tr><td>Zakup PP</td><td class="${sc(ct.zakup_pp)}">${fmt(ct.zakup_pp)}</td></tr>`;
    d += `<tr class="grp-row"><td>WYDATKI</td><td></td></tr>`;
    d += `<tr><td>Zakup na giełdzie</td><td class="neg">${fmt(cOut)}</td></tr>`;
    d += `<tr class="cat"><td>Subskrypcje</td><td class="${sc(ct.subskrypcje)}">${fmt(ct.subskrypcje)}</td></tr>${subRows(ct.breakdown.subskrypcje)}`;
    d += `<tr class="cat"><td>Usługi</td><td class="${sc(ct.uslugi)}">${fmt(ct.uslugi)}</td></tr>${subRows(ct.breakdown.uslugi)}`;
    d += `<tr class="cat"><td>Eventy</td><td class="${sc(ct.eventy)}">${fmt(ct.eventy)}</td></tr>${subRows(ct.breakdown.eventy)}`;
    d += `<tr class="total-row"><td>BILANS PP</td><td class="${sc(ct.net)}">${fmt(ct.net)}</td></tr>`;
    $('#detail').innerHTML = `<tr><th>Pozycja</th><th>PP</th></tr>${d}`;

    $('#count').textContent = `${store.length} wpisów w magazynie, ${scoped.length} w widoku (${worldName})`;
  }

  async function handleFiles(fileList) {
    let store = loadStore();
    for (const f of fileList) {
      const buf = await f.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (/�/.test(text)) text = new TextDecoder('windows-1250').decode(buf);
      try {
        store = dedupeMerge(store, normalizeImport(text, f.name, new Date()));
      } catch (e) { alert('Błąd importu ' + f.name + ': ' + e.message); }
    }
    saveStore(store);
    render();
  }

  function setupTooltip() {
    const tt = document.createElement('div');
    tt.id = 'tt';
    document.body.appendChild(tt);
    document.addEventListener('mouseover', e => {
      const el = e.target.closest('[data-label]');
      if (!el) return;
      tt.innerHTML = `<b>${el.getAttribute('data-label')}</b><br>${Number(el.getAttribute('data-value')).toLocaleString('pl-PL')} PP`;
      tt.style.display = 'block';
    });
    document.addEventListener('mousemove', e => {
      if (tt.style.display !== 'block') return;
      tt.style.left = (e.clientX + 12) + 'px';
      tt.style.top = (e.clientY + 12) + 'px';
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('[data-label]')) tt.style.display = 'none';
    });
  }

  function wire() {
    const dz = $('#dropzone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); handleFiles(e.dataTransfer.files); });
    $('#file').addEventListener('change', e => handleFiles(e.target.files));
    ['#f-world', '#f-from', '#f-to', '#f-gran'].forEach(s => $(s).addEventListener('change', () => { selectedBuckets.clear(); render(); }));
    $('#buckets').addEventListener('click', e => {
      const tr = e.target.closest('tr[data-key]');
      if (!tr) return;
      const k = tr.getAttribute('data-key');
      selectedBuckets.has(k) ? selectedBuckets.delete(k) : selectedBuckets.add(k);
      render();
    });
    document.addEventListener('click', e => {
      if (e.target.id === 'clear-sel') { selectedBuckets.clear(); render(); }
    });
    $('#export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(loadStore(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'plemiona-scalone.json'; a.click();
    });
    $('#reset').addEventListener('click', () => { if (confirm('Wyczyścić magazyn?')) { localStorage.removeItem(KEY); location.reload(); } });
    let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawSaldo, 150); });
    setupTooltip();
    render();
    requestAnimationFrame(drawSaldo);
  }

  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', wire);
  else wire();
}
</script>
