<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symulator budowy wioski — Plemiona</title>
<style>:root{--w:#2c2015;--w2:#170f08;--pg:#f4ead2;--ink:#38291a;--ink2:#6b543a;
  --acc:#7c2b2b;--gold:#a8842c;--line:#c4ac7c;--ok:#2f6b34;--zle:#8c2f2f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 50% -10%,#3a2c1c,var(--w) 45%,var(--w2)) fixed;min-height:100vh}
header{color:#f6ecd4;padding:20px 0}
h1{margin:.1em 0 0;font-size:1.6rem}
section{background:var(--pg);border:1px solid var(--line);border-radius:4px;padding:14px}
h2{margin:0 0 10px;font-size:1.05rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;background:#e3d4b0;padding:6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid #e0d2b4}
.budynek-opis{display:flex;align-items:center;gap:7px;min-width:125px}
.ikona-budynku{width:28px;height:28px;object-fit:contain;image-rendering:auto;flex:0 0 28px}
tr.zablokowany td{color:var(--ink2);background:#efe4c8}
button{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:3px;
  background:#e3d4b0;cursor:pointer}
button:hover{background:#eddfbe}
button.primary{background:var(--acc);color:#f6ecd4;border-color:#5d2020}
button:disabled{opacity:.45;cursor:not-allowed}
.kolejka-gora{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.akcje{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
#lista-krokow{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
#lista-krokow li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;
  padding:6px;border-bottom:1px solid #e0d2b4;font-size:.86rem}
#lista-krokow li.wtracenie{background:#e8f0e2}
#lista-krokow li.blad{background:#f3dede}
#lista-krokow li[draggable=true]{cursor:grab}
.czekanie{font-size:.76rem;color:var(--acc)}
.niepewny{color:var(--ink2)}
#podsumowanie{margin-top:10px;padding-top:10px;border-top:2px solid var(--line);font-size:.9rem}
#ostrzezenia{margin:8px 0 0;padding-left:18px;font-size:.82rem;color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(20,12,6,.72);display:flex;align-items:center;justify-content:center}
.modal[hidden]{display:none}
.modal-box{background:var(--pg);border:1px solid var(--line);border-radius:4px;padding:16px;width:min(680px,92vw)}
.modal-box textarea{width:100%;height:280px;font-family:ui-monospace,monospace;font-size:.8rem}
.modal-foot{display:flex;gap:8px;align-items:center;margin-top:10px}
.spacer{flex:1}

#pasek-narzedzi{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 3%;background:#241a10;color:#f6ecd4;border-bottom:2px solid var(--gold)}
#pasek-narzedzi .marka{font-weight:600;letter-spacing:.04em}
#pasek-narzedzi label{font-size:.8rem;color:var(--line)}
.rozpychacz{flex:1}
#stan-wioski{width:94%;max-width:1600px;margin:10px auto 0;background:var(--pg);border:1px solid var(--line);
  border-radius:4px;padding:10px 12px;font-size:.84rem;display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.stan-moment{font-weight:600;color:var(--acc);margin-bottom:6px}
.stan-ikony{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;padding-bottom:8px}
.poziom-budynku{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem}
.poziom-budynku img.ikona{width:20px;height:20px}
.poziom-budynku b{min-width:1.2em;text-align:center}
.stan-liczby{display:flex;flex-wrap:wrap;gap:6px 22px}
.stan-gardlo{margin-top:6px;color:var(--acc);font-weight:600}
.kolumny{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.75fr);
  gap:14px;width:94%;max-width:1600px;margin:12px auto;padding-bottom:60px}
@media (max-width:1200px){.kolumny{grid-template-columns:1fr}}
img.ikona{width:22px;height:22px;vertical-align:middle;margin-right:5px}
#zaopatrzenie h3{margin:12px 0 4px;font-size:.9rem}
#lista-dochodow,#lista-dosylek{list-style:none;margin:0;padding:0;font-size:.82rem}
#lista-dochodow li,#lista-dosylek li{display:flex;gap:6px;align-items:center;
  padding:4px 0;border-bottom:1px solid #e0d2b4}
li.wtracenie{background:#e8f0e2;font-size:.8rem;font-style:italic}
li.wtracenie .kiedy{font-weight:600;font-style:normal}
li.krok.zaznaczony{outline:2px solid var(--acc);outline-offset:-2px;background:#f0e4c6}
#lista-krokow li.ciagniony{opacity:.4}
#lista-krokow li.cel-gora{box-shadow:inset 0 3px 0 var(--acc)}
#lista-krokow li.cel-dol{box-shadow:inset 0 -3px 0 var(--acc)}
#lista-krokow.cel-koniec{box-shadow:inset 0 -4px 0 var(--acc)}
@media (max-width:900px){#stan-wioski{grid-template-columns:1fr}}
.stan-lewa,.stan-prawa{min-width:0}
.bilans{display:flex;flex-direction:column;gap:3px;font-size:.86rem}
.bilans hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.bilans-ujemny{color:var(--acc);font-weight:600}
.stan-gardlo{grid-column:1/-1}
li.wtracenie[draggable=true]{cursor:grab}</style>
</head>
<body>

<header id="pasek-narzedzi">
  <div class="marka">Plemiona · symulator</div>
  <label>Świat <select id="swiat"></select></label>
  <span class="rozpychacz"></span>
  <button id="zapisz">Zapisz</button>
  <button id="wczytaj">Wczytaj</button>
  <button id="kopiuj-tekst">Tekst</button>
  <button id="kopiuj-json" class="primary">JSON</button>
  <button id="wklej-json">Wklej</button>
  <button id="wyczysc">Wyczyść</button>
</header>

<section id="stan-wioski"></section>

<main class="kolumny">
  <section id="budynki">
    <h2>Budynki</h2>
    <table id="tabela-budynkow">
      <thead><tr>
        <th>Budynek</th><th>Drewno</th><th>Glina</th><th>Żelazo</th>
        <th>Czas</th><th>Ludność</th><th></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="kolejka">
    <h2>Kolejka</h2>
    <ol id="lista-krokow"></ol>
    <ul id="ostrzezenia"></ul>
  </section>

  <section id="zaopatrzenie">
    <h2>Zaopatrzenie</h2>
    <h3>Dochód stały <button id="dodaj-dochod">+</button></h3>
    <ul id="lista-dochodow"></ul>
    <h3>Dosyłki <button id="dodaj-zastrzyk">+</button></h3>
    <ul id="lista-dosylek"></ul>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modal-tytul">Wklej plan</h3>
    <textarea id="modal-pole" spellcheck="false"></textarea>
    <div class="modal-foot">
      <span id="modal-info"></span>
      <span class="spacer"></span>
      <button id="modal-anuluj">Anuluj</button>
      <button id="modal-ok" class="primary">Zatwierdź</button>
    </div>
  </div>
</div>

function swiat(kod) {
  const s = SWIATY[kod];
  if (!s) throw new Error(`Nieznany świat: ${kod}. Dostępne: ${Object.keys(SWIATY).join(', ')}`);
  return s;
}

// Mur na poziomach 1 i 2 pokazuje rowne 4:00 w wioskach o Ratuszu 3 i 14,

const MUR_STALY_CZAS_S = 240;
const MUR_STALY_DO_POZIOMU = 2;

// src/wioska/swiat.js
// Wyprowadzenie kosztow i ludnosci z danych swiata. Gra liczy je ze wzoru,
// wiec my tez — dzieki temu dowolny swiat dziala bez wklejania tabel.

// Math.round(-0.5) daje -0, a gra zaokragla polowke zawsze w gore.
function zaokr(x) {
  return Math.floor(x + 0.5);
}

function danegoBudynku(s, budynek) {
  const d = s.budynki[budynek];
  if (!d) throw new Error(`Budynek ${budynek} nie istnieje na świecie ${s.kod}`);
  return d;
}
function kosztPoziomu(s, budynek, poziom) {
  const d = danegoBudynku(s, budynek);
  return {
    drewno: zaokr(d.drewno * d.fDrewno ** (poziom - 1)),
    glina: zaokr(d.glina * d.fGlina ** (poziom - 1)),
    zelazo: zaokr(d.zelazo * d.fZelazo ** (poziom - 1)),
  };
}

// Wartosc w tabeli gry jest skumulowana: to laczna ludnosc budynku na tym
// poziomie, a nie przyrost wzgledem poprzedniego.
function ludnoscPoziomu(s, budynek, poziom) {
  const d = danegoBudynku(s, budynek);
  if (poziom <= 0 || d.pop === 0) return 0;
  return zaokr(d.pop * d.fPop ** (poziom - 1));
}
function maksPoziom(s, budynek) {
  return danegoBudynku(s, budynek).maks;
}

// Budynek nieobecny w configu swiata jest na nim wylaczony (np. Kosciol na 231).
function budynkiSwiata(s) {
  return Object.keys(s.budynki);
}
function poziomyStartowe(s) {
  const p = {};
  for (const b of budynkiSwiata(s)) p[b] = s.budynki[b].min;
  return p;
}

function zTabeli(tabela, poziom, nazwa) {
  const v = tabela[poziom - 1];
  if (v === undefined) throw new Error(`${nazwa}: poziom ${poziom} poza zakresem 1–${tabela.length}`);

}
function pojemnosc(poziom) {

// Kopalnia na poziomie 0 nie produkuje nic. Zalozenie: nie udalo sie tego
// potwierdzic obserwacyjnie, ale bledna wartosc rzedu kilku jednostek na
// godzine zmienia wynik kilkudniowego planu o promile.
function produkcjaGodzinowa(s, poziom) {
  if (poziom <= 0) return 0;
  return Math.floor(zTabeli(PRODUKCJA_H_BAZA30, poziom, 'Kopalnia') * s.produkcjaBazowa / 30 + 0.5);
}

// src/wioska/czas.js
// czas = maks(10 s, build_time x G(poziom) x 1,05^(-ratusz) / predkosc swiata)
function wspolczynnikG(poziom) {
  const w = TABELA_G[poziom];
  if (!w) throw new Error(`Brak współczynnika czasu dla poziomu ${poziom}`);
  return w;
}
function czasBudowy(s, budynek, poziom, poziomRatusza) {
  if (budynek === 'mur' && poziom <= MUR_STALY_DO_POZIOMU) {
    return { sekundy: MUR_STALY_CZAS_S, pewny: true };
  }
  const d = s.budynki[budynek];
  if (!d) throw new Error(`Budynek ${budynek} nie istnieje na świecie ${s.kod}`);
  const { g, zmierzony } = wspolczynnikG(poziom);
  const surowy = d.czas * g * 1.05 ** -poziomRatusza / s.predkosc;
  return { sekundy: Math.max(MINIMALNY_CZAS_S, Math.round(surowy)), pewny: zmierzony };
}

// src/wioska/wymagania.js

// Pusta lista znaczy „mozna budowac". Kolejnosc wynikow idzie za kolejnoscia
// wpisow w WYMAGANIA, zeby komunikat byl zawsze taki sam.
function brakujaceWymagania(budynek, poziomy) {
  const wym = WYMAGANIA[budynek];
  if (!wym) return [];
  const brak = [];
  for (const [wymagany, poziom] of Object.entries(wym)) {
    if ((poziomy[wymagany] ?? 0) < poziom) brak.push({ budynek: wymagany, poziom });
  }
  return brak;
}
function opisWymagan(brakujace, nazwy) {
  if (!brakujace.length) return '';
  const czesci = brakujace.map(b => `${nazwy[b.budynek] ?? b.budynek} ${b.poziom}`);
  return `Wymaga: ${czesci.join(', ')}`;
}

// src/wioska/kolejnosc-budynkow.js
// Jawna kolejnosc wyswietlania, wspolna dla tabeli budynkow i rzedu ikon
// w pasku stanu. Budynki jednorazowe sa na koncu listy.

const NA_KONIEC = ['plac', 'piedestal', 'palac'];
function kolejnoscBudynkow(s) {
  const wszystkie = budynkiSwiata(s);
  return [
    ...wszystkie.filter(b => !NA_KONIEC.includes(b)),
    ...NA_KONIEC.filter(b => wszystkie.includes(b)),
  ];
}
// src/wioska/plan.js
// Plan to czysty obiekt bez stanu interfejsu — ten sam ksztalt jedzie
// do CLI, do schowka i do localStorage.

// Obie stale sa wspoldzielone przez caly proces. Zamrazamy je, zeby
// przypadkowa mutacja wywalila sie od razu, zamiast po cichu zmienic
// wartosci domyslne kolejnych planow. Kopie do modyfikacji daje
// normalizujPlan, ktory zawsze buduje nowe obiekty.
function zamroz(obiekt) {
  for (const v of Object.values(obiekt)) {
    if (v && typeof v === 'object') zamroz(v);
  }
  return Object.freeze(obiekt);
}
const SUROWCE_STARTOWE = zamroz({ drewno: 1000, glina: 1000, zelazo: 1000 });
const PLAN_PUSTY = zamroz(normalizujPlan({ swiat: 'pl231' }));

// Os migracyjna nie moze zalezec od dochodu, ktory jest wlasnie migrowany.
// Dlatego odtwarza tylko kolejne czasy budowy, bez przestojow i magazynu.
function osBezPrzestojowDoMigracji(s, poziomyStart, kroki) {
  const poziomy = { ...poziomyStart };
  let czas = 0;
  return kroki.map(k => {
    const startS = czas;
    const { sekundy } = czasBudowy(s, k.budynek, k.doPoziomu, poziomy.ratusz ?? 1);
    czas += sekundy;
    poziomy[k.budynek] = k.doPoziomu;
    return { budynek: k.budynek, doPoziomu: k.doPoziomu, startS };
  });
}

function kotwicaZCzasu(os, czasS) {
  if (os.length === 0 || czasS <= os[0].startS) return null;
  const trafiony = os.find(k => k.startS >= czasS);
  const krok = trafiony ?? os[os.length - 1];
  return { budynek: krok.budynek, doPoziomu: krok.doPoziomu };
}
function normalizujPlan(surowy) {
  const kod = surowy?.swiat ?? 'pl231';
  const s = SWIATY[kod];
  const poziomy = s ? poziomyStartowe(s) : {};
  const kroki = (surowy?.kroki ?? []).map(k => ({
    budynek: k.budynek,
    doPoziomu: Number(k.doPoziomu),
  }));
  const startPoziomy = { ...poziomy, ...(surowy?.start?.poziomy ?? {}) };
  const potrzebnaOs = (surowy?.dochody ?? []).some(d => d.czasS !== undefined && d.kotwica === undefined)
    || (surowy?.zastrzyki ?? []).some(z => z.czasS !== undefined && z.kotwica === undefined);
  const os = s && potrzebnaOs ? osBezPrzestojowDoMigracji(s, startPoziomy, kroki) : [];
  const kluczeKrokow = new Set(kroki.map(k => `${k.budynek}|${k.doPoziomu}`));
  const kotwicaZ = (wpis) => {
    if (wpis.kotwica === undefined) return kotwicaZCzasu(os, Number(wpis.czasS ?? 0));
    if (wpis.kotwica === null) return null;
    const kotwica = { budynek: wpis.kotwica.budynek, doPoziomu: Number(wpis.kotwica.doPoziomu) };
    return kluczeKrokow.has(`${kotwica.budynek}|${kotwica.doPoziomu}`) ? kotwica : null;
  };
  const dobowa = (d, surowiec) => Number(d[`${surowiec}D`] ?? (d[`${surowiec}H`] ?? 0) * 24);
  return {
    swiat: kod,
    start: {
      poziomy: startPoziomy,
      surowce: { ...SUROWCE_STARTOWE, ...(surowy?.start?.surowce ?? {}) },
    },
    kroki,
    dochody: (surowy?.dochody ?? []).map(d => ({
      kotwica: kotwicaZ(d),
      sumaD: Number(d.sumaD ?? (dobowa(d, 'drewno') + dobowa(d, 'glina') + dobowa(d, 'zelazo'))),
      zrodlo: d.zrodlo === 'zbieractwo' ? 'zbieractwo' : 'farma',
    })),
    zastrzyki: (surowy?.zastrzyki ?? []).map(z => ({
      kotwica: kotwicaZ(z),
      drewno: Number(z.drewno ?? 0),
      glina: Number(z.glina ?? 0),
      zelazo: Number(z.zelazo ?? 0),
    })),
  };
}
function bledyPlanu(plan) {
  const bledy = [];
  let s;
  try {
    s = swiat(plan.swiat);
  } catch (e) {
    return [e.message];
  }
  const dostepne = new Set(budynkiSwiata(s));
  // Kopia poziomow startowych — sprawdzamy, czy kroki tworza ciagla sciezke.
  const poziomy = { ...plan.start.poziomy };
  plan.kroki.forEach((krok, i) => {
    if (!dostepne.has(krok.budynek)) {
      bledy.push(`Krok ${i + 1}: budynek ${krok.budynek} nie istnieje na świecie ${plan.swiat}`);
      return;
    }
    const maks = maksPoziom(s, krok.budynek);
    if (krok.doPoziomu > maks) {
      bledy.push(`Krok ${i + 1}: ${krok.budynek} ma maksymalnie ${maks} poziomów, nie ${krok.doPoziomu}`);
      return;
    }
    const oczekiwany = (poziomy[krok.budynek] ?? 0) + 1;
    if (krok.doPoziomu !== oczekiwany) {
      bledy.push(`Krok ${i + 1}: ${krok.budynek} powinien iść na poziom ${oczekiwany}, nie ${krok.doPoziomu}`);
      return;
    }
    poziomy[krok.budynek] = krok.doPoziomu;
  });
  return bledy;
}

// src/wioska/symulacja.js
// Przebieg osi czasu. W wiosce buduje sie jeden budynek naraz, wiec kroki
// ida sekwencyjnie — liczba slotow kolejki nie zmienia laczonego czasu.
// Dochod i dosylki sa przypiete do krokow (kotwica), nie do czasu — dochod
// obowiazujacy w trakcie kroku i to ostatni wpis o indeksie <= i, a wtracenia
// przypiete do kroku i staja sie aktywne dopiero PO jego ukonczeniu.

const SUROWCE = ['drewno', 'glina', 'zelazo'];
// Tolerancja na blad zaokraglenia zmiennoprzecinkowego. Bez niej "starczy na
// koszt" potrafi zostac tuz ponizej progu o kwote mniejsza niz precyzja
// dodawania do zegara, i petla nigdy sie nie konczy.
const EPS = 1e-6;

const zeroSurowce = () => ({ drewno: 0, glina: 0, zelazo: 0 });

// Kotwica -> indeks kroku w plan.kroki. null = przed pierwszym krokiem (-1).
// Kotwica wskazujaca krok nieobecny w planie (mozliwe tylko przy recznie
// edytowanym JSON) rozwiazuje sie do -1 — to siatka bezpieczenstwa, nie
// sciezka uzywana przez interfejs.
function indeksKotwicy(kotwica, kroki) {
  if (kotwica === null) return -1;
  const i = kroki.findIndex(k => k.budynek === kotwica.budynek && k.doPoziomu === kotwica.doPoziomu);
  return i;
}

// Farma i zbieractwo sa niezaleznymi strumieniami. W kazdym z nich ostatni
// aktywny wpis wygrywa, a oba aktywne strumienie sumuja sie w produkcji.
function sumaAktywnychDochodow(posortowane, indeksBiezacy) {
  const aktywne = { farma: 0, zbieractwo: 0 };
  for (const w of posortowane) {
    if (w.indeksKotwicy > indeksBiezacy) break;
    aktywne[w.zrodlo === 'zbieractwo' ? 'zbieractwo' : 'farma'] = w.sumaD;
  }
  return aktywne.farma + aktywne.zbieractwo;
}

function produkcjaNaSekunde(s, poziomy, sumaD) {
  return {
    drewno: produkcjaGodzinowa(s, poziomy.tartak ?? 0) / 3600 + sumaD / 3 / 86400,
    glina: produkcjaGodzinowa(s, poziomy.cegielnia ?? 0) / 3600 + sumaD / 3 / 86400,
    zelazo: produkcjaGodzinowa(s, poziomy.huta ?? 0) / 3600 + sumaD / 3 / 86400,
  };
}

function dolej(stan, ile, sufit) {
  for (const r of SUROWCE) {
    const suma = stan.zasoby[r] + ile[r];
    if (suma > sufit) {
      stan.zmarnowane[r] += suma - sufit;
      stan.zasoby[r] = sufit;
    } else {
      stan.zasoby[r] = suma;
    }
  }
}
function symuluj(plan) {
  const s = swiat(plan.swiat);
  const poziomy = { ...plan.start.poziomy };
  const stan = {
    zasoby: { ...plan.start.surowce },
    zmarnowane: zeroSurowce(),
  };
  const zZastrzykow = zeroSurowce();
  const kroki = [];
  const ostrzezenia = [];
  const koszt = zeroSurowce();
  let czasNiepewnyS = 0;
  let czas = 0;

  const dochody = plan.dochody
    .map(d => ({ ...d, indeksKotwicy: indeksKotwicy(d.kotwica, plan.kroki) }))
    .sort((a, b) => a.indeksKotwicy - b.indeksKotwicy);
  const zastrzyki = plan.zastrzyki
    .map(z => ({ ...z, indeksKotwicy: indeksKotwicy(z.kotwica, plan.kroki) }))
    .sort((a, b) => a.indeksKotwicy - b.indeksKotwicy);
  const zastosowaneZastrzyki = new Set();

  const ludnoscZajeta = () => budynkiSwiata(s)
    .reduce((suma, b) => suma + ludnoscPoziomu(s, b, poziomy[b] ?? 0), 0);

  // Dosylki przypiete do indeksu <= indeksBiezacy wpadaja dokladnie raz.
  const wpuscZastrzyki = (indeksBiezacy, sufit) => {
    zastrzyki.forEach((z, idx) => {
      if (zastosowaneZastrzyki.has(idx) || z.indeksKotwicy > indeksBiezacy) return;
      zastosowaneZastrzyki.add(idx);
      dolej(stan, { drewno: z.drewno, glina: z.glina, zelazo: z.zelazo }, sufit);
      for (const r of SUROWCE) zZastrzykow[r] += z[r];
    });
  };

  plan.kroki.forEach((krok, i) => {
    const sufit = pojemnosc(poziomy.spichlerz ?? 1);
    const wpis = {
      budynek: krok.budynek,
      doPoziomu: krok.doPoziomu,
      startS: czas,
      czekanieS: 0,
      czekanieNa: null,
      trwanieS: 0,
      koniecS: czas,
      koszt: zeroSurowce(),
      pewny: true,
      zasobyPo: { ...stan.zasoby },
      ludnoscPo: ludnoscZajeta(),
      poziomyPo: { ...poziomy },
      blad: null,
    };

    // Dochod i dosylki przypiete do kroku i-1 lub wczesniej dzialaja juz
    // podczas kroku i (czyli PO ukonczeniu poprzedniego kroku); przypiete
    // do kroku i same jeszcze nie dzialaja w jego trakcie.
    const indeksAktywny = i - 1;
    wpuscZastrzyki(indeksAktywny, sufit);

    const brak = brakujaceWymagania(krok.budynek, poziomy);
    if (brak.length) {
      wpis.blad = 'wymagania';
      ostrzezenia.push({ typ: 'wymagania', krok: i, tekst: `Krok ${i + 1}: ${opisWymagan(brak, NAZWY)}` });
      kroki.push(wpis);
      return;
    }

    const c = kosztPoziomu(s, krok.budynek, krok.doPoziomu);
    wpis.koszt = c;

    if (SUROWCE.some(r => c[r] > sufit)) {
      wpis.blad = 'ponad-spichlerz';
      ostrzezenia.push({
        typ: 'ponad-spichlerz', krok: i,
        tekst: `Krok ${i + 1}: ${NAZWY[krok.budynek]} ${krok.doPoziomu} kosztuje więcej, niż mieści Spichlerz ${poziomy.spichlerz} (${sufit}). Rozbuduj Spichlerz wcześniej.`,
      });
      kroki.push(wpis);
      return;
    }

    const ludnoscPo = ludnoscZajeta()
      - ludnoscPoziomu(s, krok.budynek, poziomy[krok.budynek] ?? 0)
      + ludnoscPoziomu(s, krok.budynek, krok.doPoziomu);
    const limit = maksLudnosc(poziomy.zagroda ?? 1);
    if (ludnoscPo > limit) {
      wpis.blad = 'ponad-zagrode';
      ostrzezenia.push({
        typ: 'ponad-zagrode', krok: i,
        tekst: `Krok ${i + 1}: ${NAZWY[krok.budynek]} ${krok.doPoziomu} wymaga ${ludnoscPo} ludności, a Zagroda ${poziomy.zagroda} daje ${limit}.`,
      });
      kroki.push(wpis);
      return;
    }

    // Przesuwaj zegar w krokach czasowych, az stac na koszt. Stawka jest
    // stala w trakcie oczekiwania na dany krok (dochod nie zmienia sie
    // wewnatrz trwania jednego kroku), wiec nie trzeba juz dzielic petli
    // na segmenty wedlug zdarzen czasowych.
    const poczatek = czas;
    let czekanieNa = null;
    const zmarnowanePrzed = SUROWCE.reduce((sum, r) => sum + stan.zmarnowane[r], 0);
    const sumaD = sumaAktywnychDochodow(dochody, indeksAktywny);
    const stawka = produkcjaNaSekunde(s, poziomy, sumaD);
    for (;;) {
      if (SUROWCE.every(r => stan.zasoby[r] >= c[r] - EPS)) break;
      let potrzebaS = 0;
      for (const r of SUROWCE) {
        const brakuje = c[r] - stan.zasoby[r];
        if (brakuje <= 0) continue;
        const dt = stawka[r] > 0 ? brakuje / stawka[r] : Infinity;
        if (dt > potrzebaS) { potrzebaS = dt; czekanieNa = r; }
      }
      if (potrzebaS === Infinity) {
        wpis.blad = 'brak-dochodu';
        ostrzezenia.push({
          typ: 'przestoj', krok: i,
          tekst: `Krok ${i + 1}: przy zerowej produkcji ${czekanieNa} tego kroku nie da się nigdy opłacić.`,
        });
        break;
      }
      dolej(stan, {
        drewno: stawka.drewno * potrzebaS, glina: stawka.glina * potrzebaS, zelazo: stawka.zelazo * potrzebaS,
      }, sufit);
      czas += potrzebaS;
    }

    if (wpis.blad) { kroki.push(wpis); return; }

    wpis.czekanieS = Math.round(czas - poczatek);
    wpis.czekanieNa = wpis.czekanieS > 0 ? czekanieNa : null;
    wpis.startS = Math.round(czas);
    for (const r of SUROWCE) { stan.zasoby[r] = Math.max(0, stan.zasoby[r] - c[r]); koszt[r] += c[r]; }

    const { sekundy, pewny } = czasBudowy(s, krok.budynek, krok.doPoziomu, poziomy.ratusz ?? 1);
    wpis.trwanieS = sekundy;
    wpis.pewny = pewny;
    if (!pewny) czasNiepewnyS += sekundy;

    // Produkcja plynie takze w trakcie budowy, ta sama stawka co w oczekiwaniu
    // — dochod przypiety do tego kroku zacznie dzialac dopiero po jego koncu.
    dolej(stan, {
      drewno: stawka.drewno * sekundy, glina: stawka.glina * sekundy, zelazo: stawka.zelazo * sekundy,
    }, sufit);
    czas += sekundy;

    // Ostrzegamy raz, ale dopiero po fazie budowy — magazyn potrafi przelac
    // sie wylacznie w jej trakcie, gdy na krok stac od reki i nie bylo
    // oczekiwania.
    const zmarnowanePo = SUROWCE.reduce((sum, r) => sum + stan.zmarnowane[r], 0);
    if (zmarnowanePo > zmarnowanePrzed && !ostrzezenia.some(o => o.typ === 'przepelnienie')) {
      ostrzezenia.push({
        typ: 'przepelnienie', krok: i,
        tekst: 'Spichlerz się przepełnia — część produkcji przepada. Rozbuduj go wcześniej.',
      });
    }

    poziomy[krok.budynek] = krok.doPoziomu;
    wpis.koniecS = Math.round(czas);
    wpis.zasobyPo = { ...stan.zasoby };
    wpis.ludnoscPo = ludnoscZajeta();
    wpis.poziomyPo = { ...poziomy };
    kroki.push(wpis);

    // Dosylki przypiete do tego kroku wpadaja teraz, po jego ukonczeniu —
    // zanim ruszy oczekiwanie na krok nastepny.
    wpuscZastrzyki(i, pojemnosc(poziomy.spichlerz ?? 1));
  });

  return {
    kroki,
    ostrzezenia,
    podsumowanie: {
      czasS: Math.round(czas),
      koszt,
      zZastrzykow,
      zmarnowane: {
        drewno: Math.round(stan.zmarnowane.drewno),
        glina: Math.round(stan.zmarnowane.glina),
        zelazo: Math.round(stan.zmarnowane.zelazo),
      },
      czasNiepewnyS,
    },
  };
}

// src/wioska/zapotrzebowanie.js
// Dwie rodziny liczb odporne na wahania farmienia, obie liczone na osi bez
// przestojow (magazyn i dochod sa ignorowane — to jest tempo, w jakim plan
// CHCIALBY isc, nie przebieg przy konkretnym zaopatrzeniu):
//   - czas netto i wymagany dochod dla calego planu (zapotrzebowanie),
//   - zuzycie w oknie doby od wskazanego momentu (zuzycieNaDobe) — pokazuje
//     zmiane tempa na kolejnych etapach, czego jedna liczba dla calego planu
//     nie widzi.
// Podstawa musi byc harmonogram BEZ przestojow: liczony po realnym (z
// symulacji) bilans zawsze wyszedlby zerowy przy braku surowcow, bo wtedy
// plan zuzywa dokladnie tyle, ile wplywa — miara mierzylaby sama siebie.

const SUROWCE_Z = ['drewno', 'glina', 'zelazo'];
const KOPALNIA_SUROWCA = { drewno: 'tartak', glina: 'cegielnia', zelazo: 'huta' };
const DOBA_S = 86400;
function osBezPrzestojow(plan) {
  const s = swiat(plan.swiat);
  const poziomy = { ...plan.start.poziomy };
  let czas = 0;
  return plan.kroki.map(krok => {
    const koszt = kosztPoziomu(s, krok.budynek, krok.doPoziomu);
    const { sekundy } = czasBudowy(s, krok.budynek, krok.doPoziomu, poziomy.ratusz ?? 1);
    const wiersz = { budynek: krok.budynek, doPoziomu: krok.doPoziomu, startS: czas, trwanieS: sekundy, koszt };
    czas += sekundy;
    poziomy[krok.budynek] = krok.doPoziomu;
    return wiersz;
  });
}
function zapotrzebowanie(plan) {
  const s = swiat(plan.swiat);
  const os = osBezPrzestojow(plan);
  const skumulowany = { drewno: 0, glina: 0, zelazo: 0 };
  const wyprodukowane = { drewno: 0, glina: 0, zelazo: 0 };
  const wymagany = { drewno: 0, glina: 0, zelazo: 0 };
  let waskieGardlo = null;
  let szczyt = 0;
  let brakNaStart = false;
  const poziomy = { ...plan.start.poziomy };

  os.forEach((wiersz, indeks) => {
    for (const r of SUROWCE_Z) skumulowany[r] += wiersz.koszt[r];

    for (const r of SUROWCE_Z) {
      const deficyt = skumulowany[r] - plan.start.surowce[r] - wyprodukowane[r];
      if (deficyt <= 0) continue;
      if (wiersz.startS <= 0) {
        brakNaStart = true;
        continue;
      }
      const naDobe = deficyt / (wiersz.startS / DOBA_S);
      if (naDobe > wymagany[r]) wymagany[r] = naDobe;
      if (naDobe > szczyt) {
        szczyt = naDobe;
        waskieGardlo = { indeks, budynek: wiersz.budynek, doPoziomu: wiersz.doPoziomu, surowiec: r, czasS: Math.round(wiersz.startS) };
      }
    }

    for (const r of SUROWCE_Z) {
      wyprodukowane[r] += produkcjaGodzinowa(s, poziomy[KOPALNIA_SUROWCA[r]] ?? 0) * wiersz.trwanieS / 3600;
    }
    poziomy[wiersz.budynek] = wiersz.doPoziomu;
  });

  const czasNettoS = os.length ? os[os.length - 1].startS + os[os.length - 1].trwanieS : 0;

  return {
    czasNettoS: Math.round(czasNettoS),
    wymaganyDobowo: {
      drewno: Math.ceil(wymagany.drewno),
      glina: Math.ceil(wymagany.glina),
      zelazo: Math.ceil(wymagany.zelazo),
    },
    waskieGardlo,
    brakNaStart,
  };
}
function zuzycieNaDobe(plan, indeksKrokuLubNull) {
  const os = osBezPrzestojow(plan);
  const suma = { drewno: 0, glina: 0, zelazo: 0 };
  if (os.length === 0) return { suma, doKonca: true };

  const indeksBazowy = indeksKrokuLubNull === null ? os.length - 1 : indeksKrokuLubNull;
  const wiersz = os[indeksBazowy];
  if (!wiersz) return { suma, doKonca: true };

  const T = wiersz.startS;
  const koniecOsi = os[os.length - 1].startS + os[os.length - 1].trwanieS;
  const doKonca = T + DOBA_S >= koniecOsi;
  const gorna = doKonca ? koniecOsi : T + DOBA_S;

  for (const w of os) {
    if (w.startS >= T && w.startS < gorna) {
      for (const r of SUROWCE_Z) suma[r] += w.koszt[r];
    }
  }
  return { suma, doKonca };
}
function zapotrzebowanieDzienne(plan) {
  const os = osBezPrzestojow(plan);
  if (os.length === 0) return [];

  const ostatni = os[os.length - 1];
  const czasNettoS = ostatni.startS + ostatni.trwanieS;
  const liczbaDni = Math.ceil(czasNettoS / DOBA_S);

  const dni = [];
  for (let i = 0; i < liczbaDni; i++) {
    dni.push({ dzien: i, drewno: 0, glina: 0, zelazo: 0, liczbaKrokow: 0 });
  }

  for (const wiersz of os) {
    const indeksDnia = Math.floor(wiersz.startS / DOBA_S);
    const cel = dni[indeksDnia];
    cel.liczbaKrokow += 1;
    for (const r of SUROWCE_Z) cel[r] += wiersz.koszt[r];
  }

  return dni;
}

// src/wioska/format.js
// Dwie postacie eksportu: tekst do przepisania do Menedzera Konta
// i JSON, ktory jest kanalem wymiany planu z Claude.
function czasCzytelny(sekundy) {
  const s = Math.max(0, Math.round(sekundy));
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (d) return `${d} d ${String(h).padStart(2, '0')} h ${String(m).padStart(2, '0')} min`;
  if (h) return `${h} h ${String(m).padStart(2, '0')} min`;
  // Ponizej minuty pokazujemy sekundy: minimalny czas budowy to 10 s, a caly
  // wczesny etap planu mieści sie w tym zakresie i wyswietlalby sie jako zero.
  if (m) return `${m} min`;
  return `${s} s`;
}
function planJSON(plan) {
  return JSON.stringify(plan, null, 2);
}

function liczba(n) {
  return Math.round(n).toLocaleString('pl-PL');
}
function planTekst(plan, wynik, zap = null) {
  const linie = [`Plan budowy — ${plan.swiat}`, ''];
  plan.kroki.forEach((k, i) => {
    linie.push(`${String(i + 1).padStart(3)}. ${NAZWY[k.budynek] ?? k.budynek} → ${k.doPoziomu}`);
  });
  const { koszt, czasS, zmarnowane, zZastrzykow } = wynik.podsumowanie;
  linie.push('', 'Podsumowanie');
  if (zap) {
    linie.push(`  Czas netto (bez przestojów): ${czasCzytelny(zap.czasNettoS)}`);
  }
  linie.push(`  Łączny czas: ${czasCzytelny(czasS)}`);
  linie.push(`  Surowce: ${liczba(koszt.drewno)} drewna, ${liczba(koszt.glina)} gliny, ${liczba(koszt.zelazo)} żelaza`);
  if (zap) {
    const w = zap.wymaganyDobowo;
    linie.push(`  Wymagany dochód: ${liczba(w.drewno)} / ${liczba(w.glina)} / ${liczba(w.zelazo)} na dobę`);
    if (zap.waskieGardlo) {
      const g = zap.waskieGardlo;
      linie.push(`  Wąskie gardło: krok ${g.indeks + 1} — ${NAZWY[g.budynek] ?? g.budynek} → ${g.doPoziomu}`);
    }
    if (zap.brakNaStart) {
      linie.push('  Uwaga: na pierwszy krok nie starcza surowców startowych.');
    }
  }
  if (zZastrzykow.drewno || zZastrzykow.glina || zZastrzykow.zelazo) {
    linie.push(`  Z dosyłek: ${liczba(zZastrzykow.drewno)} / ${liczba(zZastrzykow.glina)} / ${liczba(zZastrzykow.zelazo)}`);
  }
  if (zmarnowane.drewno || zmarnowane.glina || zmarnowane.zelazo) {
    linie.push(`  Zmarnowane przez pełny spichlerz: ${liczba(zmarnowane.drewno)} / ${liczba(zmarnowane.glina)} / ${liczba(zmarnowane.zelazo)}`);
  }
  return linie.join('\n');
}
function osCzasuTekst(wynik) {
  const linie = ['  # | start        | krok                      | trwanie      | uwagi'];
  wynik.kroki.forEach((k, i) => {
    const nazwa = `${NAZWY[k.budynek] ?? k.budynek} → ${k.doPoziomu}`;
    const uwagi = [];
    if (k.blad) uwagi.push(`BŁĄD: ${k.blad}`);
    if (k.czekanieS > 0) uwagi.push(`czeka ${czasCzytelny(k.czekanieS)} na ${NAZWY_SUROWCOW[k.czekanieNa] ?? k.czekanieNa}`);
    linie.push(
      `${String(i + 1).padStart(3)} | ${czasCzytelny(k.startS).padEnd(12)} | ${nazwa.padEnd(25)} | ${czasCzytelny(k.trwanieS).padEnd(12)} | ${uwagi.join('; ')}`,
    );
  });
  if (wynik.ostrzezenia.length) {
    linie.push('', 'Ostrzeżenia:');
    for (const o of wynik.ostrzezenia) linie.push(`  • ${o.tekst}`);
  }
  return linie.join('\n');
}

// src/wioska/widok-budynki.js
// Tabela budynkow, wzorowana na ekranie Ratusza w grze.const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));function ikonaHTML(budynek, nazwa) {

}function wierszBudynkuHTML(s, budynek, poziomy, poziomRatusza) {

  }

  const ludnosc = ludnoscPoziomu(s, budynek, docelowy) - ludnoscPoziomu(s, budynek, obecny);
  const brak = brakujaceWymagania(budynek, poziomy);

  return `<tr class="${zablokowany ? 'zablokowany' : ''}">`
    + `<td>${ikonaHTML(budynek, nazwa)}${esc(nazwa)}<br><small>${obecny === 0 ? 'nie istnieje' : `Poziom ${obecny}`}</small></td>`
    + `<td>${k.drewno}</td><td>${k.glina}</td><td>${k.zelazo}</td>`

// src/wioska/widok-kolejka.js

}

  return `<li class="naglowek-dnia">Dzień ${wiersz.dzien + 1} · `
    + `${Math.round(wiersz.drewno)} / ${Math.round(wiersz.glina)} / ${Math.round(wiersz.zelazo)} · `
    + `${wiersz.liczbaKrokow} ${wiersz.liczbaKrokow === 1 ? 'krok' : 'kroki'}</li>`;
}

// Nazwa DOBA_S jest juz zajeta w zapotrzebowanie.js — build.js skleja oba
// pliki w jeden wspolny zakres (patrz LOGIC w build.js), wiec druga stala
// o tej samej nazwie bylaby bledem skladni w przegladarce.
const DOBA_KOLEJKI_S = 86400;

function indeksKotwicyKolejki(kotwica, kroki) {
  if (kotwica === null) return -1;
  return kroki.findIndex(k => k.budynek === kotwica.budynek && k.doPoziomu === kotwica.doPoziomu);
}

// Kroki, wtracenia gracza i naglowki dni w jednej liscie. Wtracenie stoi
// zaraz po kroku, do ktorego kotwiczy — nawet gdy ten krok konczy dzien,
// wiec wtracenie ma wyladowac PRZED naglowkiem kolejnego dnia, nie po nim.function kolejkaHTML(plan, wynik, zaznaczony) {
  const os = osBezPrzestojow(plan);
  const dni = zapotrzebowanieDzienne(plan);
  const wtracenia = [
    ...plan.dochody.map((d, idx) => ({ i: indeksKotwicyKolejki(d.kotwica, plan.kroki), rodzaj: 'dochod', wpis: d, idx })),
    ...plan.zastrzyki.map((z, idx) => ({ i: indeksKotwicyKolejki(z.kotwica, plan.kroki), rodzaj: 'dosylka', wpis: z, idx })),
  ].sort((a, b) => a.i - b.i);

  let w = 0;
  let ostatniDzien = -1;
  const out = [];
  wynik.kroki.forEach((k, i) => {
    while (w < wtracenia.length && wtracenia[w].i <= i - 1) {
      const wpis = wtracenia[w];
      out.push(wtracenieHTML(wpis.rodzaj, wpis.wpis, i, wpis.idx));
      w += 1;
    }
    const dzienKroku = Math.floor(os[i].startS / DOBA_KOLEJKI_S);
    for (let d = ostatniDzien + 1; d <= dzienKroku; d++) out.push(naglowekDniaHTML(dni[d]));
    ostatniDzien = dzienKroku;
    out.push(krokHTML(k, i, i === zaznaczony));
  });
  while (w < wtracenia.length) {
    const wpis = wtracenia[w];
    out.push(wtracenieHTML(wpis.rodzaj, wpis.wpis, null, wpis.idx));
    w += 1;
  }
  return out.join('');
}
// src/wioska/widok-bilans.js
// Bilans zaopatrzenia dla wskazanego momentu: trzy strumienie dochodu
// (eko, farma, zbieractwo), ich suma, zuzycie na dobe liczone po osi bez
// przestojow, i roznica — ile na dobe brakuje albo zostaje.

const SUROWCE_B = ['drewno', 'glina', 'zelazo'];

// Kopia rozwiazywania kotwicy na indeks, analogiczna do symulacji, ale
// swiadomie osobna: widoki maja byc cienkie i nie ciagnac wewnetrznej,
// nieeksportowanej logiki silnika.
function indeksKotwicyWidoku(kotwica, kroki) {
  if (kotwica === null) return -1;
  return kroki.findIndex(k => k.budynek === kotwica.budynek && k.doPoziomu === kotwica.doPoziomu);
}

function sumaZrodla(plan, indeksAktywny, zrodlo) {
  const trafione = plan.dochody
    .map(d => ({ ...d, i: indeksKotwicyWidoku(d.kotwica, plan.kroki) }))
    .filter(d => d.zrodlo === zrodlo && d.i <= indeksAktywny)
    .sort((a, b) => a.i - b.i);
  // Tak jak w symulacji: kazde zrodlo ma jeden aktywny wpis naraz, ostatni
  // w kolejnosci indeksu kotwicy wygrywa.
  return trafione.length ? trafione[trafione.length - 1].sumaD : 0;
}

function dosylkiDoIndeksu(plan, indeks) {
  const suma = { drewno: 0, glina: 0, zelazo: 0 };
  for (const z of plan.zastrzyki) {
    const i = indeksKotwicyWidoku(z.kotwica, plan.kroki);
    if (i <= indeks) for (const r of SUROWCE_B) suma[r] += z[r];
  }
  return suma;
}
function bilansHTML(s, plan, wynik, zap, indeks) {
  const indeksAktywny = indeks === null ? plan.kroki.length - 1 : indeks;
  const poziomy = indeks === null
    ? (wynik.kroki[wynik.kroki.length - 1]?.poziomyPo ?? { ...plan.start.poziomy })
    : (wynik.kroki[indeks]?.poziomyPo ?? { ...plan.start.poziomy });

  const eko = {
    drewno: produkcjaGodzinowa(s, poziomy.tartak ?? 0) * 24,
    glina: produkcjaGodzinowa(s, poziomy.cegielnia ?? 0) * 24,
    zelazo: produkcjaGodzinowa(s, poziomy.huta ?? 0) * 24,
  };
  const farmaD = sumaZrodla(plan, indeksAktywny, 'farma');
  const zbieractwoD = sumaZrodla(plan, indeksAktywny, 'zbieractwo');
  const farma = { drewno: farmaD / 3, glina: farmaD / 3, zelazo: farmaD / 3 };
  const zbieractwo = { drewno: zbieractwoD / 3, glina: zbieractwoD / 3, zelazo: zbieractwoD / 3 };
  const razem = {};
  for (const r of SUROWCE_B) razem[r] = eko[r] + farma[r] + zbieractwo[r];

  const zuzycie = zuzycieNaDobe(plan, indeks);
  const etykietaZuzycia = zuzycie.doKonca ? 'Zużycie do końca planu' : 'Zużycie / dobę';

  const bilans = {};
  for (const r of SUROWCE_B) bilans[r] = razem[r] - zuzycie.suma[r];

  const dos = dosylkiDoIndeksu(plan, indeksAktywny);

  const wiersz = (etykieta, w) => `<div><b>${esc(etykieta)}</b> ${Math.round(w.drewno)} / ${Math.round(w.glina)} / ${Math.round(w.zelazo)}</div>`;
  const klasaBilansu = SUROWCE_B.some(r => bilans[r] < 0) ? 'bilans-ujemny' : '';

  return [
    '<div class="bilans">',
    wiersz('EKO / dobę', eko),
    wiersz('Farma / dobę', farma),
    wiersz('Zbieractwo / dobę', zbieractwo),
    '<hr>',
    wiersz('Razem', razem),
    wiersz(etykietaZuzycia, zuzycie.suma),
    `<div class="${klasaBilansu}"><b>Bilans</b> ${Math.round(bilans.drewno)} / ${Math.round(bilans.glina)} / ${Math.round(bilans.zelazo)}</div>`,
    `<div><b>Dosyłki razem</b> ${dos.drewno} / ${dos.glina} / ${dos.zelazo}</div>`,
    '</div>',
  ].join('');
}

// src/wioska/widok-status.js
// Stan wioski na wskazany moment osi, w dwoch kolumnach: stan wioski (lewa)
// i bilans zaopatrzenia (prawa). Rzad ikon budynkow wzorowany na
// "Podsumowaniu" w Menedzerze Konta, z poziomem pod ikona.

const SUROWCE_S = ['drewno', 'glina', 'zelazo'];

function stanNaKrok(s, plan, wynik, indeks) {
  if (indeks === null || !wynik.kroki[indeks]) {
    const ostatni = wynik.kroki[wynik.kroki.length - 1];
    return {
      poziomy: ostatni ? ostatni.poziomyPo : { ...plan.start.poziomy },
      czasS: wynik.podsumowanie.czasS,
      ludnosc: ostatni ? ostatni.ludnoscPo : kolejnoscBudynkow(s)
        .reduce((suma, b) => suma + ludnoscPoziomu(s, b, plan.start.poziomy[b] ?? 0), 0),
      wydano: wynik.podsumowanie.koszt,
      indeks: null,
    };
  }
  const k = wynik.kroki[indeks];
  const wydano = { drewno: 0, glina: 0, zelazo: 0 };
  for (let i = 0; i <= indeks; i++) {
    if (wynik.kroki[i].blad) continue;
    for (const r of SUROWCE_S) wydano[r] += wynik.kroki[i].koszt[r];
  }
  return { poziomy: k.poziomyPo, czasS: k.koniecS, ludnosc: k.ludnoscPo, wydano, indeks };
}

function stanWioskiHTML(s, plan, wynik, zap, st, indeks) {
  const ikony = kolejnoscBudynkow(s)
    .map(b => `<span class="poziom-budynku" data-poziom-${esc(b)}="${st.poziomy[b] ?? 0}">`
      + `${ikonaHTML(b, NAZWY[b] ?? b)}<b>${st.poziomy[b] ?? 0}</b></span>`)
    .join('');
  const prodH = {
    drewno: produkcjaGodzinowa(s, st.poziomy.tartak ?? 0),
    glina: produkcjaGodzinowa(s, st.poziomy.cegielnia ?? 0),
    zelazo: produkcjaGodzinowa(s, st.poziomy.huta ?? 0),
  };
  const limit = maksLudnosc(st.poziomy.zagroda ?? 1);
  const etykieta = indeks === null
    ? 'stan końcowy'
    : `krok ${indeks + 1} — ${czasCzytelny(st.czasS)}`;

  return [
    `<div class="stan-moment">● ${esc(etykieta)}</div>`,
    `<div class="stan-ikony">${ikony}</div>`,
    `<div class="stan-liczby">`,
    `<span title="Czas budowy przy założeniu, że surowców nigdy nie brakuje"><b>Czas budowy bez przerw</b> ${czasCzytelny(zap.czasNettoS)}</span>`,
    `<span title="Czas obejmujący produkcję i zaopatrzenie"><b>Czas budowy realny</b> ${czasCzytelny(wynik.podsumowanie.czasS)}</span>`,
    `<span><b>Aktualne eko</b> ${Math.round(prodH.drewno)} / ${Math.round(prodH.glina)} / ${Math.round(prodH.zelazo)} na h</span>`,
    `<span><b>Populacja</b> ${st.ludnosc} / ${limit}</span>`,
    `<span><b>Wydano</b> ${st.wydano.drewno} / ${st.wydano.glina} / ${st.wydano.zelazo}</span>`,
    `</div>`,
  ].join('');
}
function pasekStanuHTML(s, plan, wynik, zap, indeks) {
  const st = stanNaKrok(s, plan, wynik, indeks);
  const lewa = stanWioskiHTML(s, plan, wynik, zap, st, indeks);
  const prawa = bilansHTML(s, plan, wynik, zap, indeks);
  const wiersze = [
    `<div class="stan-lewa">${lewa}</div>`,
    `<div class="stan-prawa">${prawa}</div>`,
  ];
  if (zap.waskieGardlo) {
    const g = zap.waskieGardlo;
    wiersze.push(`<div class="stan-gardlo">Wąskie gardło: krok ${g.indeks + 1} — ${esc(NAZWY[g.budynek] ?? g.budynek)} → ${g.doPoziomu}</div>`);
  }
  if (zap.brakNaStart) {
    wiersze.push('<div class="stan-gardlo">Na pierwszy krok nie starcza surowców startowych.</div>');
  }
  return wiersze.join('');
}

// src/wioska/strona.js
// Warstwa DOM: stan interfejsu i wpinanie zdarzen. Cale budowanie HTML
// siedzi w modulach widok-*.js i jest testowane bez przegladarki.
const KLUCZ_MAGAZYNU = 'plemiona-wioska';
function uruchom() {
  if (typeof document === 'undefined') return;

  const $ = (id) => document.getElementById(id);
  let plan = wczytajPlan();
  let zaznaczony = null;
  let trybModalu = 'wklej';
  let ciagniony = null;

  function wczytajPlan() {
    try {
      const zapis = localStorage.getItem(KLUCZ_MAGAZYNU);
      if (zapis) return normalizujPlan(JSON.parse(zapis));
    } catch { /* uszkodzony zapis nie moze blokowac strony */ }
    return normalizujPlan({ swiat: 'pl231' });
  }

  function zapisz() {
    try { localStorage.setItem(KLUCZ_MAGAZYNU, planJSON(plan)); } catch { /* tryb prywatny */ }
  }

  // Tabela budynkow pokazuje stan po wszystkich krokach, zeby kolejne
  // klikniecie dokladalo nastepny poziom.
  function poziomyPoKolejce() {
    const p = { ...plan.start.poziomy };
    for (const k of plan.kroki) p[k.budynek] = k.doPoziomu;
    return p;
  }

  // Kroki niosa poziom docelowy, wiec po kazdej zmianie kolejnosci trzeba je
  // ponumerowac od nowa — inaczej plan przestaje byc ciagly.
  function przelicz() {
    const poziomy = { ...plan.start.poziomy };
    for (const k of plan.kroki) {
      k.doPoziomu = (poziomy[k.budynek] ?? 0) + 1;
      poziomy[k.budynek] = k.doPoziomu;
    }
  }

  // Kotwica identyfikuje krok przez budynek i poziom. Gdy przelicz zmieni
  // poziomy po przeciaganiu lub usunieciu, odtwarzamy kotwice z tozsamosci
  // obiektu kroku, zeby wtracenie nie przeskoczylo na inny krok.
  function zapamietajKrokiKotwic() {
    return [...plan.dochody, ...plan.zastrzyki].map(wpis => ({
      wpis,
      krok: wpis.kotwica === null ? null : plan.kroki.find(k =>
        k.budynek === wpis.kotwica.budynek && k.doPoziomu === wpis.kotwica.doPoziomu) ?? null,
    }));
  }

  function odtworzKotwice(powiazania, usuwany = null, poprzedni = null) {
    for (const p of powiazania) {
      const krok = p.krok === usuwany ? poprzedni : p.krok;
      p.wpis.kotwica = krok && plan.kroki.includes(krok)
        ? { budynek: krok.budynek, doPoziomu: krok.doPoziomu }
        : null;
    }
  }

  function zaopatrzenieHTML() {
    $('lista-dochodow').innerHTML = plan.dochody.map((d, i) =>
      `<li><span class="opis">${d.sumaD} na dobę (${esc(d.zrodlo)})</span>`
      + `<button data-usun-dochod="${i}" title="Usuń">×</button></li>`).join('');
    $('lista-dosylek').innerHTML = plan.zastrzyki.map((z, i) =>
      `<li><span class="opis">${z.drewno} / ${z.glina} / ${z.zelazo}</span>`
      + `<button data-usun-dosylke="${i}" title="Usuń">×</button></li>`).join('');
  }

  function rysuj() {
    const s = swiat(plan.swiat);
    const poziomy = poziomyPoKolejce();
    $('tabela-budynkow').tBodies[0].innerHTML = kolejnoscBudynkow(s)
      .map(b => wierszBudynkuHTML(s, b, poziomy, poziomy.ratusz ?? 1)).join('');

    const bledy = bledyPlanu(plan);
    if (bledy.length) {
      $('lista-krokow').innerHTML = '';
      $('stan-wioski').innerHTML = '';
      $('ostrzezenia').innerHTML = bledy.map(b => `<li>${esc(b)}</li>`).join('');
      zaopatrzenieHTML();
      zapisz();
      return;
    }
    const wynik = symuluj(plan);
    const zap = zapotrzebowanie(plan);
    if (zaznaczony !== null && !wynik.kroki[zaznaczony]) zaznaczony = null;
    $('lista-krokow').innerHTML = kolejkaHTML(plan, wynik, zaznaczony);
    $('stan-wioski').innerHTML = pasekStanuHTML(s, plan, wynik, zap, zaznaczony);
    $('ostrzezenia').innerHTML = wynik.ostrzezenia.map(o => `<li>${esc(o.tekst)}</li>`).join('');
    zaopatrzenieHTML();
    zapisz();
  }

  function pytajOLiczbe(etykieta) {
    const v = prompt(etykieta, '0');
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
  }

  function otworzModal(tryb, tytul, tresc) {
    trybModalu = tryb;
    $('modal-tytul').textContent = tytul;
    $('modal-pole').value = tresc;
    $('modal-info').textContent = '';
    $('modal').hidden = false;
    $('modal-pole').focus();
    if (tryb === 'kopiuj') $('modal-pole').select();
  }

  async function doSchowka(tekst, opis) {
    try {
      await navigator.clipboard.writeText(tekst);
    } catch {
      otworzModal('kopiuj', `${opis} — skopiuj ręcznie`, tekst);
    }
  }

  document.addEventListener('click', (e) => {
    const dodaj = e.target.closest('[data-dodaj]');
    if (dodaj) {
      const budynek = dodaj.dataset.dodaj;
      // Poziom docelowy nadaje przelicz(), zeby regula numeracji zyla
      // w jednym miejscu — tak samo jak przy usuwaniu i zmianie kolejnosci.
      plan.kroki.push({ budynek, doPoziomu: 0 });
      przelicz();
      rysuj();
      return;
    }
    const usun = e.target.closest('[data-usun]');
    if (usun) {
      const indeksUsuwany = Number(usun.dataset.usun);
      const usuwanyKrok = plan.kroki[indeksUsuwany];
      const poprzedniKrok = indeksUsuwany > 0 ? plan.kroki[indeksUsuwany - 1] : null;
      const powiazania = zapamietajKrokiKotwic();
      plan.kroki.splice(indeksUsuwany, 1);
      zaznaczony = null;
      przelicz();
      odtworzKotwice(powiazania, usuwanyKrok, poprzedniKrok);
      rysuj();
      return;
    }
    const usunD = e.target.closest('[data-usun-dochod]');
    if (usunD) { plan.dochody.splice(Number(usunD.dataset.usunDochod), 1); rysuj(); return; }
    const usunZ = e.target.closest('[data-usun-dosylke]');
    if (usunZ) { plan.zastrzyki.splice(Number(usunZ.dataset.usunDosylke), 1); rysuj(); return; }
    const krok = e.target.closest('[data-krok]');
    if (krok) {
      const i = Number(krok.dataset.krok);
      zaznaczony = zaznaczony === i ? null : i;
      rysuj();
    }
  });

  const lista = $('lista-krokow');

  lista.addEventListener('dragstart', (e) => {
    const krokEl = e.target.closest('[data-krok]');
    const wtracenieEl = !krokEl ? e.target.closest('[data-wtracenie]') : null;
    if (!krokEl && !wtracenieEl) return;
    if (krokEl) {
      ciagniony = { typ: 'krok', indeks: Number(krokEl.dataset.krok) };
      krokEl.classList.add('ciagniony');
    } else {
      ciagniony = { typ: wtracenieEl.dataset.wtracenieRodzaj, indeks: Number(wtracenieEl.dataset.wtracenie) };
      wtracenieEl.classList.add('ciagniony');
    }
    if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
  });

  // Cel upuszczenia moze byc kafelkiem kroku albo wtraceniem, ktore niesie
  // indeks kroku stojacego za nim. Brak obu znaczy upuszczenie pod lista.
  function elementCelu(e) {
    return e.target.closest('[data-krok],[data-przed-krokiem]');
  }
  function indeksZElementu(el) {
    if (!el) return null;
    const wartosc = el.dataset.krok ?? el.dataset.przedKrokiem;
    return wartosc === undefined ? null : Number(wartosc);
  }

  // Bez podswietlenia celu nie widac, gdzie krok wyladuje.
  lista.addEventListener('dragover', (e) => {
    if (ciagniony === null) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    for (const el of lista.querySelectorAll('.cel-gora,.cel-dol')) el.classList.remove('cel-gora', 'cel-dol');
    lista.classList.remove('cel-koniec');
    const el = elementCelu(e);
    const cel = indeksZElementu(el);
    if (cel === null) { lista.classList.add('cel-koniec'); return; }
    const referencyjny = ciagniony.typ === 'krok' ? ciagniony.indeks : cel;
    el.classList.add(cel < referencyjny ? 'cel-gora' : 'cel-dol');
  });

  function posprzatajPodswietlenie() {
    for (const el of lista.querySelectorAll('.ciagniony,.cel-gora,.cel-dol')) {
      el.classList.remove('ciagniony', 'cel-gora', 'cel-dol');
    }
    lista.classList.remove('cel-koniec');
  }

  lista.addEventListener('drop', (e) => {
    if (ciagniony === null) return;
    e.preventDefault();
    const indeksCelu = indeksZElementu(elementCelu(e));
    if (ciagniony.typ === 'krok') {
      const cel = indeksCelu === null ? plan.kroki.length - 1 : indeksCelu;
      if (cel !== ciagniony.indeks) {
        const powiazania = zapamietajKrokiKotwic();
        const [krok] = plan.kroki.splice(ciagniony.indeks, 1);
        plan.kroki.splice(cel, 0, krok);
        przelicz();
        odtworzKotwice(powiazania);
        zaznaczony = null;
      }
    } else {
      const listaWtracen = ciagniony.typ === 'dochod' ? plan.dochody : plan.zastrzyki;
      const wpis = listaWtracen[ciagniony.indeks];
      if (wpis) {
        const poprzedni = indeksCelu === null
          ? plan.kroki[plan.kroki.length - 1]
          : (indeksCelu > 0 ? plan.kroki[indeksCelu - 1] : null);
        wpis.kotwica = poprzedni ? { budynek: poprzedni.budynek, doPoziomu: poprzedni.doPoziomu } : null;
      }
    }
    ciagniony = null;
    posprzatajPodswietlenie();
    rysuj();
  });

  lista.addEventListener('dragend', () => { ciagniony = null; posprzatajPodswietlenie(); });

  function kotwicaOdZaznaczenia() {
    if (zaznaczony === null || !plan.kroki[zaznaczony]) return null;
    const k = plan.kroki[zaznaczony];
    return { budynek: k.budynek, doPoziomu: k.doPoziomu };
  }

  $('dodaj-dochod').addEventListener('click', () => {
    const zrodlo = confirm('OK = zbieractwo, Anuluj = farma') ? 'zbieractwo' : 'farma';
    plan.dochody.push({
      kotwica: kotwicaOdZaznaczenia(),
      sumaD: pytajOLiczbe('Suma na dobę (dzielona równo na drewno/glinę/żelazo)'),
      zrodlo,
    });
    rysuj();
  });

  $('dodaj-zastrzyk').addEventListener('click', () => {
    plan.zastrzyki.push({
      kotwica: kotwicaOdZaznaczenia(),
      drewno: pytajOLiczbe('Drewno'),
      glina: pytajOLiczbe('Glina'),
      zelazo: pytajOLiczbe('Żelazo'),
    });
    rysuj();
  });
  $('zapisz').addEventListener('click', () => { zapisz(); });
  $('wczytaj').addEventListener('click', () => { plan = wczytajPlan(); zaznaczony = null; rysuj(); });
  $('kopiuj-json').addEventListener('click', () => doSchowka(planJSON(plan), 'Plan w formacie JSON'));
  $('kopiuj-tekst').addEventListener('click', () => {
    const tekst = planTekst(plan, symuluj(plan), zapotrzebowanie(plan));
    doSchowka(tekst, 'Plan tekstem');
  });
  $('wklej-json').addEventListener('click', () => otworzModal('wklej', 'Wklej plan', ''));
  $('modal-anuluj').addEventListener('click', () => { $('modal').hidden = true; });
  $('modal-ok').addEventListener('click', () => {
    if (trybModalu === 'kopiuj') { $('modal').hidden = true; return; }
    try {
      plan = normalizujPlan(JSON.parse($('modal-pole').value));
      przelicz();
      zaznaczony = null;
      $('modal').hidden = true;
      rysuj();
    } catch (err) {
      $('modal-info').textContent = `Nie udało się wczytać: ${err.message}`;
    }
  });

  $('wyczysc').addEventListener('click', () => {
    plan = normalizujPlan({ swiat: plan.swiat });
    zaznaczony = null;
    rysuj();
  });

  $('swiat').innerHTML = Object.values(SWIATY)
    .map(x => `<option value="${esc(x.kod)}">${esc(x.nazwa)}</option>`).join('');
  $('swiat').value = plan.swiat;
  $('swiat').addEventListener('change', (e) => {
    plan = normalizujPlan({ swiat: e.target.value });
    zaznaczony = null;
    rysuj();
  });

  rysuj();
}

uruchom();
</script>
</body>
</html>
